<div class="stella-content">
  <h2><input name="name" value="{{item.name}}"></h2>
  <div class="stella-fields">
    <label>{{localize "Stella.Type"}}<input name="system.type" value="{{system.type}}"></label>
    <label>{{localize "Stella.Class"}}<input name="system.class" value="{{system.class}}"></label>
    <label>{{localize "Stella.Timing"}}<input name="system.timing" value="{{system.timing}}"></label>
    <label>{{localize "Stella.Number"}} (0 = unassigned)<input type="number" name="system.number" min="0" max="6" value="{{system.number}}"></label>
    <label>Set dice<input type="number" name="system.charge" min="0" value="{{system.charge}}"></label>
    <label>Source page<input type="number" name="system.page" min="0" value="{{system.page}}"></label>
  </div>
  <label>{{localize "Stella.Effect"}}<textarea name="system.effect" rows="12">{{system.effect}}</textarea></label>
  <label>{{localize "Stella.Word"}}<textarea name="system.word" rows="3">{{system.word}}</textarea></label>
  <details><summary>{{localize "Stella.Custom"}}</summary><p>Catalog effects use their built-in rules. For a new skill, leave the key empty and enter its Attack dice / movement below. The Director applies other custom effects.</p><label>Rule key<input name="system.key" value="{{system.key}}"></label><label>Attack dice<input name="system.attackDice" type="number" min="0" max="99" value="{{system.attackDice}}"></label><label>Movement maximum<input name="system.move" type="number" min="0" max="6" value="{{system.move}}"></label></details>
</div>
